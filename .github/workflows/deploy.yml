name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Plain git instead of actions/checkout — this runner is a persistent
      # machine with the repo already cloned, so there's no need to fetch and
      # unpack the checkout action from codeload.github.com on every run
      # (and its rate limits) just to do what `git pull` already does here.
      - name: Update code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/Caelc2216/budget.git"
          if [ -d .git ]; then
            git fetch "$REMOTE" main
            git reset --hard FETCH_HEAD
          else
            git clone "$REMOTE" .
          fi

      - name: Install dependencies
        run: npm install

      - name: Sync database schema
        run: npm run db:push

      - name: Build
        run: npm run build

      - name: Restart app
        run: pm2 restart budget
