name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Restart app
        run: pm2 restart budget
