name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Plain git instead of actions/checkout — this runner is a persistent
      # machine with the repo already cloned, so there's no need to fetch and
      # unpack the checkout action from codeload.github.com on every run
      # (and its rate limits) just to do what `git pull` already does here.
      - name: Update code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/Caelc2216/budget.git"
          if [ -d .git ]; then
            git fetch "$REMOTE" main
            git reset --hard FETCH_HEAD
          else
            git clone "$REMOTE" .
          fi

      - name: Install dependencies
        run: npm install

      - name: Back up database
        # Snapshot to Google Drive before the schema push below, which can drop
        # data. Doesn't block the deploy if the backup fails (e.g. Drive is
        # unreachable) — check this step's log if the deploy shows a warning.
        continue-on-error: true
        run: npx tsx scripts/backup-db.ts

      - name: Sync database schema
        # --accept-data-loss: needed non-interactively since prisma can't prompt
        # for confirmation here. Widening a unique constraint (as in this repo's
        # history) is safe; a genuinely destructive change (dropping/renaming a
        # column) would still need reviewing by running `npm run db:push` by
        # hand first, since that CLI stays interactive and will warn/refuse.
        run: npx prisma db push --accept-data-loss

      - name: Build
        run: npm run build

      - name: Restart app
        run: pm2 restart budget
